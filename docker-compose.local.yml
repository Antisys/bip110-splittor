services:
  redis-local:
    image: redis:7.4-alpine
    container_name: redis-local-cache
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-local:
    image: node:22-trixie
    container_name: bip110-backend-local
    restart: unless-stopped
    working_dir: /workspace
    command:
      - /bin/sh
      - -c
      - npm ci && exec npx ts-node webapp/backend/server.ts --mainnet
    environment:
      NETWORK_MODE: mainnet
      PORT: "4000"
      REDIS_URL: redis://redis-local:6379
      BITCOIN_EXPLORER_URL: https://mempool.space
      BIP110_EXPLORER_URL: https://mempool.bitcoinx.gr
    volumes:
      - .:/workspace
      - backend_local_node_modules:/workspace/node_modules
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      redis-local:
        condition: service_healthy

volumes:
  backend_local_node_modules:
    name: bip110_backend_local_node_modules
